<!DOCTYPE html>
<!-- 조립 결과 파일: 수정은 _src/pages/404.html 원본에서 하고 python3 _src/build.py로 다시 조립함 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 해법동반 법률사무소</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 없는 주소 안내 화면이라 검색 결과에 넣지 않음 -->
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=f943f2e6">
<style>
/* 메뉴바·바닥글·로고 없이 일반적인 404 안내만 화면 가운데에 두고, 글꼴은 제목용 명조 하나로 통일 */
.nf { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; font-family: var(--serif); }
.nf h1 { margin-top: 20px; font: 600 18px/1.5 var(--serif); }
.nf p { margin-top: 8px; font-size: 14px; line-height: 1.8; color: var(--ink-soft); }
/* 숫자 404는 「.nf p」 규칙보다 앞서도록 선택자를 구체적으로 지정함 */
/* 명조 숫자는 굵고 크면 제목보다 무거워 보이므로 가볍게 지정함 */
.nf .nf-code { margin: 0; font: 500 clamp(40px, 4vw, 48px)/1 var(--serif); color: var(--ink-soft); }
/* 처음 화면 링크는 「‹ 구성원 목록」과 같은 모양 */
.nf .back { margin-top: 32px; }
</style>
</head>
<body>

<main class="nf">
  <p class="nf-code" aria-hidden="true">404</p>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 <span class="nw">없는 페이지입니다.</span></p>
  <a class="back" href="/"><span class="chev chev-left" aria-hidden="true"></span>처음 화면으로</a>
</main>

</body>
</html>
